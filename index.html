*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:24px 22px 70px}.topline{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:14px}.eyebrow{font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:.12em;font-weight:800}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.head h1{font-size:clamp(24px,4vw,34px);margin:3px 0 2px;letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px}.monthbox{margin:20px 0 12px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:13px 15px}.monthrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.monthrow small{color:var(--muted)}.monthrow strong{font-size:15px}.monthinput{margin-top:8px;width:100%;background:transparent;border:0;color:var(--text);outline:0;font-weight:700}.progress{height:5px;background:#26302b;border-radius:10px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--green);width:0;transition:width .2s}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 28px}.tab{background:#282b2a;border:1px solid #343a37;border-radius:10px;padding:11px 8px;color:#b7c0ba;font-weight:700;font-size:12px}.tab.active{outline:1px solid var(--blue);border-color:var(--blue);color:#fff;background:#1c2421}.tab .ico{display:block;font-size:15px;margin-bottom:2px}.section{display:none}.section.active{display:block}.section-kicker{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.06em}.section h2{font-size:19px;margin:4px 0 5px}.intro{color:var(--muted);font-size:12px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}.card h3{font-size:14px;margin:0 0 12px}.field{display:block;margin:10px 0}.field span,.label{display:block;color:#aab5ad;font-size:11px;font-weight:700;margin-bottom:5px}.input,textarea,select{width:100%;background:#080b09;border:1px solid #29312d;border-radius:9px;padding:11px 12px;outline:none}.input:focus,textarea:focus,select:focus{border-color:#4e8069}textarea{resize:vertical;min-height:74px}input[type=range]{width:100%;accent-color:var(--green)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row{display:flex;align-items:center;gap:9px}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted)}.tiny{font-size:11px}.btn{border:1px solid var(--line);background:#1b211e;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700}.btn.primary{background:#123c2a;border-color:#1b754b;color:#b9ffda}.btn.danger{color:#ff9d9d}.add{width:100%;border:1px dashed #39443e;background:transparent;color:#c3ccc6;border-radius:9px;padding:10px;font-size:12px;font-weight:700;margin-top:8px}.item{border:1px solid #27302b;background:#0b0f0d;border-radius:10px;padding:11px;margin:9px 0}.item-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.item-title{font-size:12px;font-weight:800}.item .field{margin:7px 0}.stat{font-size:22px;font-weight:800}.green{color:var(--green)}.pink{color:var(--pink)}.gold{color:var(--gold)}.barline{height:6px;background:#27302b;border-radius:8px;overflow:hidden;margin-top:6px}.barline i{display:block;height:100%;background:var(--green)}.checkline{display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid #202723;font-size:12px}.checkline:last-child{border:0}.checkline input{accent-color:var(--green);width:15px;height:15px}.note{font-size:11px;color:var(--muted);margin-top:8px}.budgetrow{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;margin:8px 0}.budgetrow input{padding:8px}.empty{color:var(--muted);text-align:center;padding:18px;font-size:12px}.footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;margin-top:22px}.status{display:inline-flex;align-items:center;gap:6px}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}.auth{max-width:420px;margin:10vh auto;padding:24px}.auth h1{font-size:25px}.auth .card{padding:22px}.auth .btn{width:100%;margin-top:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#202923;border:1px solid #435348;border-radius:10px;padding:10px 15px;font-size:12px;z-index:20;max-width:90vw}.hidden{display:none!important}.addform{display:flex;gap:8px;align-items:center;margin-top:10px}.addform .input{min-width:0;flex:1}.icon-img{width:19px;height:19px;object-fit:contain;vertical-align:middle}.tab .icon-img{display:block;margin:0 auto 4px;width:22px;height:22px}.brand-icon{width:34px;height:34px;object-fit:contain;vertical-align:middle;margin-right:8px}
@media(max-width:680px){.app{padding:16px 12px calc(30px + env(safe-area-inset-bottom))}.topline{margin-bottom:10px}.head{align-items:center}.monthbox{margin-top:15px}.tabs{gap:4px;margin:12px 0 23px}.tab{padding:9px 3px;font-size:10px}.tab .ico{font-size:14px}.grid2,.grid3{grid-template-columns:1fr}.card{padding:13px}.budgetrow{grid-template-columns:1fr 84px}.head h1{font-size:23px}.footer{flex-wrap:wrap;gap:8px}}

/* Charcoal + soft sage palette */
:root{color-scheme:dark;--bg:#171819;--panel:#202223;--panel2:#292c2d;--line:#383c3d;--text:#e8e9e7;--muted:#a0a5a1;--green:#9caf9f;--blue:#a6aaa8;--pink:#c49ba9;--gold:#c5b58b}
body{background:var(--bg);color:var(--text)}
.eyebrow,.green{color:#a9bbaa}
.monthbox,.card{background:#202223;border-color:#383c3d}
.progress{background:#343a36}.progress i,.barline i{background:#91a694}
.tabs .tab{background:#292c2d;border-color:#3b4040;color:#c4c8c5}
.tabs .tab.active{outline:1px solid #87978b;border-color:#87978b;color:#f4f5f3;background:#343a36}

.input:focus,textarea:focus,select:focus{border-color:#91a694}
input[type=range],.checkline input{accent-color:#9caf9f}

<body><div id="app"><main class="auth"><div class="eyebrow">PERSONAL SYSTEM</div><h1>My Life Dashboard</h1><p class="sub">Личное пространство для планов, привычек и роста.</p><div class="card"><h3>Подключение Supabase</h3><p class="note">Укажи URL проекта и publishable / anon public key. Настройка сохранится в этом браузере.</p><label class="field"><span>Project URL</span><input id="sburl" class="input" placeholder="https://xxxx.supabase.co"></label><label class="field"><span>Anon public key</span><textarea id="sbkey" placeholder="sb_publishable_..."></textarea></label><button class="btn primary" id="connect">Подключить Supabase</button></div></main></div><div id="toast"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>Math.random().toString(36).slice(2,10);
const KEY='hq_supabase_cfg_v1', LOCAL='my_life_dashboard_v1';
let client=null,user=null,sessionReady=false,authMode='login',data=blank(),active='finance',saveTimer=null,saving=false,saveAgain=false,dirty=false,retryDelay=1500,lastSaved=null;
function localDate(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function displayDate(){const d=new Date();return [String(d.getDate()).padStart(2,'0'),String(d.getMonth()+1).padStart(2,'0'),d.getFullYear()].join('/')}
function blank(){return {month:localDate().slice(0,7),income:50000,budgets:[['Продукты',5300],['Транспорт',6767],['Красота и уход',0],['Одежда',0],['Образование',0],['Развлечения',0],['Прочее',0],['Накопления',0]],goals:['Цель 1','Цель 2','Цель 3'],purchases:'',books:[{title:'',author:'',status:'Читаю'}],readingNotes:'',readingGoal:'Например: 30 минут в день',subjects:[{name:'Русский язык',grade:'Баллы',topic:'Название темы',progress:0,tasks:[]} ,{name:'Литература',grade:'Баллы',topic:'Название темы',progress:0,tasks:[]},{name:'Профильная математика',grade:'Баллы',topic:'Название темы',progress:0,tasks:[]},{name:'Обществознание',grade:'Баллы',topic:'Название темы',progress:0,tasks:[]}],studyNotes:'',urgentTasks:[],films:[{name:'',director:'',review:''}],cinemaSkills:[],cinemaIdeas:'',projects:'',habits:['Чтение','Английский','Активность','Рефлексивная практика','Уход за собой'],habitDone:{},identity:'',reflection:''};}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2400)}
function cfg(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function saveLocal(){localStorage.setItem(LOCAL,JSON.stringify(data))}
function setSync(label,state='idle'){const el=$('#sync');if(el){el.textContent=label;el.dataset.state=state}}
function scheduleSave(){saveLocal();dirty=true;setSync('Изменения сохранены на устройстве · отправка в облако…','pending');clearTimeout(saveTimer);saveTimer=setTimeout(saveCloud,450)}
async function saveCloud(){if(!user||!client||!dirty)return;if(saving){saveAgain=true;return}saving=true;saveAgain=false;const snapshot=JSON.stringify(data);try{const payload=JSON.parse(snapshot);const {error}=await client.from('workspaces').upsert({user_id:user.id,config:{lifeDashboard:payload,version:2},entries:{},updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;lastSaved=new Date();retryDelay=1500;if(JSON.stringify(data)===snapshot){dirty=false;setSync('Синхронизировано · '+lastSaved.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),'ok')}else{dirty=true;saveAgain=true;setSync('Сохраняются последние изменения…','pending')}}catch(e){console.error('Supabase save:',e);dirty=true;setSync('Нет связи с облаком · повторим автоматически','error');clearTimeout(saveTimer);saveTimer=setTimeout(saveCloud,retryDelay);retryDelay=Math.min(retryDelay*2,60000)}finally{saving=false;if(saveAgain||dirty&&$('#sync')?.dataset.state==='pending')setTimeout(saveCloud,250)}}
function flushSave(){saveLocal();if(dirty)saveCloud()}
async function loadCloud(){if(!user)return;try{let {data:r,error}=await client.from('workspaces').select('config').eq('user_id',user.id).maybeSingle();if(error)throw error;if(r?.config?.lifeDashboard){data={...blank(),...r.config.lifeDashboard};data.cinemaSkills=data.cinemaSkills||[];saveLocal()}else{dirty=true;await saveCloud()}}catch(e){toast('Не удалось загрузить облачные данные: '+e.message)}render()}
function renderAuth(){let c=cfg();$('#app').innerHTML=`<main class="auth"><div class="eyebrow">PERSONAL SYSTEM</div><h1>My Life Dashboard</h1><p class="sub">Личное пространство для планов, привычек и роста.</p><div class="card">${!c?`<h3>Подключение Supabase</h3><p class="note">Укажи URL проекта и publishable / anon public key. Настройка сохранится в этом браузере.</p><label class="field"><span>Project URL</span><input id="sburl" class="input" placeholder="https://xxxx.supabase.co"></label><label class="field"><span>Anon public key</span><textarea id="sbkey" placeholder="sb_publishable_..."></textarea></label><button class="btn primary" id="connect">Подключить Supabase</button>`:`<h3>Подключение настроено</h3><p class="note">Выполняется подключение к Supabase. Регистрация и вход вручную отключены. Подключение выполняется анонимно через Supabase.</p><button class="btn primary" id="retry">Подключиться</button><button class="add" id="resetcfg">Изменить настройки Supabase</button>`}</div></main>`;
if(!c){$('#connect').onclick=()=>{let url=$('#sburl').value.trim().replace(/\/+$/,''),key=$('#sbkey').value.trim();if(!url||!key)return toast('Заполни оба поля');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url))return toast('Проверь Project URL');localStorage.setItem(KEY,JSON.stringify({url,anonKey:key}));boot()}}else{$('#retry').onclick=()=>boot();$('#resetcfg').onclick=()=>{localStorage.removeItem(KEY);client=null;user=null;renderAuth()}}}
async function boot(){let c=cfg();if(!c){renderAuth();return}try{client=window.supabase.createClient(c.url,c.anonKey);const {data:r,error:sessionError}=await client.auth.getSession();if(sessionError)throw sessionError;user=r.session?.user||null;
client.auth.onAuthStateChange((ev,s)=>{user=s?.user||null;if(user&&ev==='SIGNED_IN')loadCloud();else if(!user)renderAuth()});
if(!user){let {data:anon,error}=await client.auth.signInAnonymously();if(error)throw error;user=anon.user}
let raw=localStorage.getItem(LOCAL);if(raw){try{data={...blank(),...JSON.parse(raw)};data.cinemaSkills=data.cinemaSkills||[]}catch{}}
await loadCloud();
}catch(e){console.error(e);renderAuth();toast('Supabase: '+(e.message||'ошибка подключения'))}}
function shell(){let tabs=[['finance','finance.png','Финансы'],['reading','reading.png','Чтение'],['study','study.png','Учёба'],['cinema','cinema.png','Кино'],['self','self.png','Self']];return `<main class="app"><div class="topline"><span class="eyebrow">PERSONAL SYSTEM</span><span id="todayDate">${displayDate()}</span></div><header class="head"><div><h1><img class="brand-icon" src="./site-icon.png" alt="">My Life Dashboard</h1><div class="sub">A space to plan, create, learn & grow.</div></div><button class="btn" id="settingsBtn" aria-label="Настройки">⚙ Настройки</button></header><div class="monthbox"><div class="monthrow"><small>Текущий месяц</small><small>Мои направления</small></div><div class="monthrow"><strong>${monthName(data.month)}</strong><strong>${completed()}/${total()}</strong></div><input class="monthinput" id="month" type="month" value="${esc(data.month)}"><div class="progress"><i style="width:${total()?completed()/total()*100:0}%"></i></div></div><nav class="tabs">${tabs.map(([id,ico,n])=>`<button class="tab ${active===id?'active':''}" data-tab="${id}"><span class="ico"><img class="icon-img" src="./${ico}" alt=""></span>${n}</button>`).join('')}</nav>${section()}<div class="footer"><span class="status" id="sync">Синхронизация с Supabase</span><span>My Life Dashboard · Personal workspace</span></div></main>`}
function monthName(v){try{return new Date(v+'-02').toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}catch{return v}}
function completed(){return Object.values(data.habitDone).filter(Boolean).length}
function total(){return data.habits.length}
function section(){return active==='settings'?settings():active==='finance'?finance():active==='reading'?reading():active==='study'?study():active==='cinema'?cinema():self()}
function settings(){const c=cfg()||{};return `<section class="section active"><div class="section-kicker">SETTINGS</div><h2>Настройки сайта</h2><p class="intro">Дата, синхронизация и резервная копия</p><div class="card"><h3>Сегодня</h3><div class="stat" id="settingsDate">${displayDate()}</div><p class="note">Дата берётся автоматически с устройства в его местном часовом поясе. Обновляется при открытии сайта и при возвращении на вкладку.</p></div><div class="card"><h3>Синхронизация Supabase</h3><p class="note">Изменения сначала мгновенно сохраняются на устройстве, затем отправляются в Supabase. При временной потере сети отправка повторяется автоматически с увеличением интервала.</p><div class="between"><span class="muted tiny">Статус</span><b class="tiny" id="settingsSync">${dirty?'Ожидает отправки':'Подключено'}</b></div><button class="btn primary" id="syncNow">Синхронизировать сейчас</button></div><div class="card"><h3>Подключение проекта</h3><p class="note">${esc(c.url||'URL не указан')}<br>Ключ хранится локально в этом браузере.</p><button class="btn" id="changeSupabase">Изменить настройки Supabase</button></div><div class="card"><h3>Резервная копия</h3><p class="note">Скачай копию своих данных или восстанови её на другом устройстве.</p><div class="row"><button class="btn" id="exportData">Экспорт JSON</button><label class="btn" for="importData">Импорт JSON</label><input class="hidden" id="importData" type="file" accept="application/json,.json"></div></div><div class="card"><h3>Сброс данных</h3><p class="note">Удалит все твои данные (финансы, книги, предметы, фильмы, привычки, заметки) на этом устройстве и в облаке. Это нельзя отменить. Чтобы подтвердить, введи точно: <b>Я согласен(-на) на удаление данных</b></p><input class="input" id="wipeConfirm" placeholder="Я согласен(-на) на удаление данных" autocomplete="off"><button class="btn danger" id="wipeBtn" type="button" disabled style="margin-top:10px;opacity:.5">Стереть все данные</button></div></section>`}
function finance(){let planned=data.budgets.reduce((a,x)=>a+(+x[1]||0),0),remain=(+data.income||0)-planned;return `<section class="section active"><div class="section-kicker">01 / FINANCES</div><h2>Финансовый план и контроль бюджета</h2><p class="intro">Доходы, расходы, накопления и финансовые цели</p><div class="card"><h3>Доход за месяц</h3><label class="field"><input class="input" id="income" type="number" value="${+data.income||0}"></label><div class="grid2"><div><div class="label">Запланированные расходы</div><div class="stat">${fmt(planned)} ₽</div></div><div><div class="label">Остаток от дохода</div><div class="stat green">${fmt(remain)} ₽</div></div></div></div><div class="card"><h3>Распределение бюджета</h3>${data.budgets.map((b,i)=>`<div class="budgetrow"><div><div class="item-title">${esc(b[0])}</div><div class="barline"><i style="width:${data.income?Math.min(100,(+b[1]||0)/data.income*100):0}%"></i></div></div><div class="row"><input class="input budget" data-i="${i}" type="number" value="${+b[1]||0}" aria-label="${esc(b[0])}"><button class="btn danger delbudget" data-i="${i}" type="button">×</button></div></div>`).join('')}<div class="addform"><input class="input" id="newCategory" placeholder="Название категории"><button class="btn primary" id="addbudget">Добавить</button></div></div><div class="card"><h3>Финансовые цели</h3>${data.goals.map((g,i)=>`<div class="row"><label class="field" style="flex:1"><input class="input goal" data-i="${i}" value="${esc(typeof g==='string'?g:g.name||'')}" placeholder="Название цели"></label><button class="btn danger delgoal" data-i="${i}" type="button">Удалить</button></div>`).join('')}<div class="addform"><input class="input" id="newGoal" placeholder="Например: накопить на поездку"><button class="btn primary" id="addgoal">Добавить цель</button></div></div><div class="card"><h3>Покупки, которые планирую</h3><textarea id="purchases" placeholder="Покупка, стоимость, приоритет...">${esc(data.purchases)}</textarea></div></section>`}
function reading(){return `<section class="section active"><div class="section-kicker">02 / READING</div><h2>Читательский дневник и интеллектуальный рост</h2><p class="intro">Мои книги, заметки и цель по чтению</p><div class="card"><h3>Мои книги</h3>${data.books.map((b,i)=>`<div class="item"><div class="item-head"><span class="item-title">Книга ${i+1}</span><button class="btn danger delbook" data-i="${i}">Удалить</button></div><label class="field"><span>Статус</span><select class="bookstatus" data-i="${i}">${['Читаю','В планах','Прочитано','Брошено'].map(x=>`<option ${b.status===x?'selected':''}>${x}</option>`).join('')}</select></label><input class="input booktitle" data-i="${i}" value="${esc(b.title)}" placeholder="Название произведения"><input class="input bookauthor" data-i="${i}" value="${esc(b.author)}" placeholder="Автор" style="margin-top:7px"></div>`).join('')}<button class="add" id="addbook">＋ Добавить книгу</button></div><div class="card"><h3>Читательские заметки</h3><textarea id="readingNotes" placeholder="Цитаты, идеи, персонажи, темы, впечатления, материал для ЕГЭ...">${esc(data.readingNotes)}</textarea></div><div class="card"><h3>Моя цель по чтению</h3><input class="input" id="readingGoal" value="${esc(data.readingGoal)}" placeholder="Например: 30 минут в день"></div></section>`}
function study(){return `<section class="section active"><div class="section-kicker">03 / EDUCATION</div><h2>Подготовка к экзаменам и текущие задачи</h2><p class="intro">Предметы, прогресс и учебный план</p><div class="card"><h3>Предметы ЕГЭ</h3>${data.subjects.map((s,i)=>`<div class="item"><div class="item-head"><b class="item-title">${esc(s.name||'Новый предмет')}</b><button class="btn danger delsubject" data-i="${i}">Удалить</button></div><label class="field"><span>Целевой результат</span><select class="grade" data-i="${i}">${['Баллы','Оценка','Уровень'].map(x=>`<option ${s.grade===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>Тема, которую изучаю сейчас</span><input class="input topic" data-i="${i}" value="${esc(s.topic)}" placeholder="Название темы"></label><div class="between"><span class="label">Субъективный прогресс</span><b class="tiny">${+s.progress||0}%</b></div><input type="range" min="0" max="100" value="${+s.progress||0}" class="studyprogress" data-i="${i}"><div class="label">Задачи по предмету</div>${(s.tasks||[]).map((t,j)=>`<label class="checkline"><input type="checkbox" class="studytask" data-i="${i}" data-j="${j}" ${t.done?'checked':''}><span style="flex:1">${esc(t.text)}</span><button class="btn danger deltask" data-i="${i}" data-j="${j}" type="button">×</button></label>`).join('')}<div class="addform"><input class="input newtask" data-i="${i}" placeholder="Новая задача"><button class="btn primary addtask" data-i="${i}" type="button">Добавить</button></div></div>`).join('')}<div class="addform"><input class="input" id="newSubject" placeholder="Название предмета"><button class="btn primary" id="addsubject" type="button">Добавить предмет</button></div></div><div class="card"><h3>Срочные задания</h3>${(data.urgentTasks||[]).map((t,j)=>`<div class="row checkline"><input type="checkbox" class="urgdone" data-j="${j}" ${t.done?'checked':''}><span style="flex:1${t.done?';text-decoration:line-through;opacity:.6':''}">${esc(t.text)}</span><button class="btn danger delurg" data-j="${j}" type="button">Удалить</button></div>`).join('')||'<div class="empty">Срочных заданий нет</div>'}<div class="addform"><input class="input" id="newUrgent" placeholder="Например: сдать сочинение до пятницы"><button class="btn primary" id="addurgent" type="button">Добавить</button></div><p class="note">Выполнено задач по предметам: ${data.subjects.reduce((n,s)=>n+(s.tasks||[]).filter(t=>t.done).length,0)}</p></div><div class="card"><h3>Дополнительные заметки</h3><textarea id="studyNotes" placeholder="Ошибки, дедлайны, расписание, темы для повторения...">${esc(data.studyNotes)}</textarea></div></section>`}
function cinema(){return `<section class="section active"><div class="section-kicker">04 / CINEMA</div><h2>Мой путь в режиссуру</h2><p class="intro">Цели и кинематографические наблюдения</p><div class="card"><h3>Цели в киноиндустрии</h3><textarea id="cinemaIdeas" placeholder="Каким режиссёром хочу стать? Чему научиться? Какие проекты создать?">${esc(data.cinemaIdeas)}</textarea></div><div class="card"><h3>Фильмы для анализа</h3>${data.films.map((f,i)=>`<div class="item"><div class="item-head"><b class="item-title">Фильм ${i+1}</b><button class="btn danger delfilm" data-i="${i}">Удалить</button></div><input class="input filmname" data-i="${i}" value="${esc(f.name)}" placeholder="Название фильма"><input class="input filmdirector" data-i="${i}" value="${esc(f.director)}" placeholder="Режиссёр" style="margin-top:7px"><textarea class="filmreview" data-i="${i}" placeholder="Что запомнилось? Визуальный язык, монтаж, сцены... " style="margin-top:7px">${esc(f.review)}</textarea></div>`).join('')}<div class="addform"><input class="input" id="newFilm" placeholder="Название фильма"><button class="btn primary" id="addfilm" type="button">Добавить фильм</button></div></div><div class="card"><h3>Навыки для развития в кино</h3><p class="note">Добавляй навыки: монтаж, операторское мастерство, сценарий и другие.</p>${(data.cinemaSkills||[]).map((sk,i)=>`<div class="row checkline"><span style="flex:1">${esc(sk)}</span><button class="btn danger delskill" data-i="${i}" type="button">Удалить</button></div>`).join('')}<div class="addform"><input class="input" id="newSkill" placeholder="Например: монтаж"><button class="btn primary" id="addSkill" type="button">Добавить навык</button></div></div><div class="card"><h3>Идеи собственных проектов</h3><textarea id="projects" placeholder="Сюжеты, образы, персонажи, сцены, диалоги...">${esc(data.projects)}</textarea></div></section>`}
function self(){return `<section class="section active"><div class="section-kicker">05 / SELF</div><h2>Моя жизнь, привычки и личное развитие</h2><p class="intro">Мои привычки, рефлексия и личные ценности</p><div class="card"><h3>Мои привычки</h3>${data.habits.map((h,i)=>`<label class="checkline"><input type="checkbox" class="habit" data-i="${i}" ${data.habitDone[h]?'checked':''}>${esc(h)} <span class="muted tiny" style="margin-left:auto">${data.habitDone[h]?'Готово':''}</span><button class="btn danger delhabit" data-i="${i}" type="button">×</button></label>`).join('')}<div class="addform"><input class="input" id="newHabit" placeholder="Название привычки"><button class="btn primary" id="addhabit">Добавить</button></div></div><div class="card"><h3>Кем я хочу стать?</h3><textarea id="identity" placeholder="Мои качества, ценности, навыки, мечты...">${esc(data.identity)}</textarea></div><div class="card"><h3>Рефлексия</h3><textarea id="reflection" placeholder="Что меня радует? Что я понял(а)? Чем горжусь? Что хочу изменить?">${esc(data.reflection)}</textarea></div></section>`}
function fmt(n){return Math.round(+n||0).toLocaleString('ru-RU')}
function render(){if(!user){renderAuth();return}$('#app').innerHTML=shell();$('#month').onchange=e=>{data.month=e.target.value;update()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});$('#settingsBtn').onclick=()=>{active='settings';render()};bind();bindSettings()}
function update(){scheduleSave();render()}
function bindSettings(){if($('#wipeConfirm')){const PH='Я согласен(-на) на удаление данных',inp=$('#wipeConfirm'),btn=$('#wipeBtn');inp.oninput=()=>{const ok=inp.value.trim()===PH;btn.disabled=!ok;btn.style.opacity=ok?1:.5};btn.onclick=()=>{if(inp.value.trim()!==PH)return;clearTimeout(saveTimer);data=blank();saveLocal();dirty=true;active='finance';render();saveCloud();toast('Все данные удалены')}}if($('#syncNow'))$('#syncNow').onclick=()=>{clearTimeout(saveTimer);dirty=true;saveCloud()};if($('#changeSupabase'))$('#changeSupabase').onclick=()=>{if(!confirm('Изменить подключение? Текущие данные останутся в этом браузере.'))return;localStorage.removeItem(KEY);client=null;user=null;renderAuth()};if($('#exportData'))$('#exportData').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-life-dashboard-backup.json';a.click();URL.revokeObjectURL(a.href)};if($('#importData'))$('#importData').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());const restored=obj.data||obj.lifeDashboard||obj;if(!restored||typeof restored!=='object'||Array.isArray(restored))throw Error('Неверный формат файла');data={...blank(),...restored};saveLocal();dirty=true;active='settings';render();scheduleSave();toast('Данные импортированы и поставлены в очередь синхронизации')}catch(err){toast('Не удалось импортировать: '+err.message)}}}
function on(sel,fn){const el=document.querySelector(sel);if(el)el.onclick=fn}
function bind(){const val=(id,key,cast=x=>x)=>{let el=$('#'+id);if(el)el.oninput=e=>{data[key]=cast(e.target.value);scheduleSave()}};val('income','income',Number);['purchases','readingNotes','readingGoal','studyNotes','cinemaIdeas','projects','identity','reflection'].forEach(k=>val(k,k));
document.querySelectorAll('.budget').forEach(e=>e.onchange=()=>{data.budgets[+e.dataset.i][1]=+e.value||0;update()});document.querySelectorAll('.goal').forEach(e=>e.onchange=()=>{data.goals[+e.dataset.i]=e.value;scheduleSave()});
document.querySelectorAll('.booktitle,.bookauthor,.bookstatus').forEach(e=>e.onchange=()=>{let b=data.books[+e.dataset.i];b[e.classList.contains('booktitle')?'title':e.classList.contains('bookauthor')?'author':'status']=e.value;scheduleSave()});
document.querySelectorAll('.delbook').forEach(e=>e.onclick=()=>{data.books.splice(+e.dataset.i,1);update()});on('#addbook',()=>{data.books.push({title:'',author:'',status:'В планах'});update()});
document.querySelectorAll('.grade,.topic').forEach(e=>e.onchange=()=>{data.subjects[+e.dataset.i][e.classList.contains('grade')?'grade':'topic']=e.value;scheduleSave()});
document.querySelectorAll('.studyprogress').forEach(e=>e.oninput=()=>{data.subjects[+e.dataset.i].progress=+e.value;e.previousElementSibling.querySelector('b').textContent=e.value+'%';scheduleSave()});
document.querySelectorAll('.studytask').forEach(e=>e.onchange=()=>{data.subjects[+e.dataset.i].tasks[+e.dataset.j].done=e.checked;scheduleSave()});
document.querySelectorAll('.deltask').forEach(e=>e.onclick=ev=>{ev.preventDefault();data.subjects[+e.dataset.i].tasks.splice(+e.dataset.j,1);update()});document.querySelectorAll('.addtask').forEach(e=>e.onclick=()=>{let input=document.querySelector('.newtask[data-i=\"'+e.dataset.i+'\"]'),t=input?.value.trim();if(!t)return toast('Введи название задачи');data.subjects[+e.dataset.i].tasks.push({text:t,done:false});update()});
document.querySelectorAll('.delsubject').forEach(e=>e.onclick=()=>{data.subjects.splice(+e.dataset.i,1);update()});on('#addsubject',()=>{let n=$('#newSubject')?.value.trim();if(!n)return toast('Введи название предмета');data.subjects.push({name:n,grade:'Баллы',topic:'',progress:0,tasks:[]});update()});
document.querySelectorAll('.urgdone').forEach(e=>e.onchange=()=>{data.urgentTasks[+e.dataset.j].done=e.checked;update()});document.querySelectorAll('.delurg').forEach(e=>e.onclick=()=>{data.urgentTasks.splice(+e.dataset.j,1);update()});on('#addurgent',()=>{let t=$('#newUrgent')?.value.trim();if(!t)return toast('Введи задание');(data.urgentTasks=data.urgentTasks||[]).push({text:t,done:false});update()});
document.querySelectorAll('.filmname,.filmdirector,.filmreview').forEach(e=>e.onchange=()=>{let f=data.films[+e.dataset.i];f[e.classList.contains('filmname')?'name':e.classList.contains('filmdirector')?'director':'review']=e.value;scheduleSave()});
document.querySelectorAll('.delfilm').forEach(e=>e.onclick=()=>{data.films.splice(+e.dataset.i,1);update()});on('#addfilm',()=>{let n=$('#newFilm')?.value.trim();if(!n)return toast('Введи название фильма');data.films.push({name:n,director:'',review:''});update()});
document.querySelectorAll('.habit').forEach(e=>e.onchange=()=>{data.habitDone[data.habits[+e.dataset.i]]=e.checked;update()});document.querySelectorAll('.delhabit').forEach(e=>e.onclick=ev=>{ev.preventDefault();let h=data.habits[+e.dataset.i];data.habits.splice(+e.dataset.i,1);delete data.habitDone[h];update()});on('#addhabit',()=>{let h=$('#newHabit')?.value.trim();if(!h)return toast('Введи название привычки');data.habits.push(h);update()});
on('#addbudget',()=>{let n=$('#newCategory')?.value.trim();if(!n)return toast('Введи название категории');data.budgets.push([n,0]);update()});
 document.querySelectorAll('.delbudget').forEach(e=>e.onclick=()=>{data.budgets.splice(+e.dataset.i,1);update()});document.querySelectorAll('.delgoal').forEach(e=>e.onclick=()=>{data.goals.splice(+e.dataset.i,1);update()});on('#addgoal',()=>{let n=$('#newGoal')?.value.trim();if(!n)return toast('Введи название цели');data.goals.push(n);update()});
 document.querySelectorAll('.delskill').forEach(e=>e.onclick=()=>{data.cinemaSkills.splice(+e.dataset.i,1);update()});on('#addSkill',()=>{let n=$('#newSkill')?.value.trim();if(!n)return toast('Введи название навыка');data.cinemaSkills.push(n);update()});
}
document.addEventListener('change',e=>{if(e.target.matches('input,textarea,select')){let sync=$('#sync');if(sync)sync.textContent='Есть несохранённые изменения'}});window.addEventListener('beforeunload',flushSave);window.addEventListener('pagehide',flushSave);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave();else{const d=displayDate();if($('#todayDate'))$('#todayDate').textContent=d;if($('#settingsDate'))$('#settingsDate').textContent=d;if(dirty)saveCloud()}});window.addEventListener('online',()=>{if(dirty)saveCloud()});
let local=localStorage.getItem(LOCAL);if(local){try{data={...blank(),...JSON.parse(local)}}catch{}}boot();
})();
</script></body></html>
